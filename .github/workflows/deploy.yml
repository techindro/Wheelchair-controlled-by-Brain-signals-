name: CI & GitHub Pages Deployment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-python-dsp-ml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate BCI ML Classifier
        run: |
          python socket_communication_codes/bci_ml_classifier.py

      - name: Validate EEG Signal Processor
        run: |
          python socket_communication_codes/eeg_signal_processor.py

      - name: Validate Emergency SOS System
        run: |
          python socket_communication_codes/emergency_sos.py

  deploy-pages:
    environment: github-pages
    runs-on: ubuntu-latest
    needs: test-python-dsp-ml
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
